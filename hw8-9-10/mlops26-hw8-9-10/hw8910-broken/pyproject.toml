[project]
name = "mlops-hw8910"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "prefect>=3.9,<4"]

[project.optional-dependencies]
model = ["torch==2.14.0", "transformers==5.17.0", "peft==0.21.0", "mlflow==2.22.2"]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"flow.py" = ["E402"]
"tools/*.py" = ["E402"]
"integration/*.py" = ["E402"]
