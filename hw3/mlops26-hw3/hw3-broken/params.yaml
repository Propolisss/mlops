# Единственная точка конфигурации ДЗ 3.
# Ни один путь, порог или размер среза не должен появляться в коде строкой.

collect:
  # Версия датасета переключается ЗДЕСЬ. Всё остальное — следствие.
  version: "v2"              # v1 | v2
  n_rows: 40000              # строк, берём из каждого файла-источника ПОСЛЕ фильтров.
                             # Потолок, а не выборка: он выше самого крупного
                             # файла (немецкий срез, 33 504 строки), поэтому
                             # оба среза берутся целиком. Резать источник по
                             # первым N нельзя — он склеен из трёх выгрузок,
                             # и повторы тикетов живут на стыке между ними.
  sources:
    v1:
      - "sources/tickets-en.jsonl"
    v2:
      - "sources/tickets-en.jsonl"
      - "sources/tickets-de.jsonl"

  # Снимок источника. Сеть живёт в scripts/fetch_source.py, стадия collect
  # читает только уже скачанные файлы: иначе dvc repro зависел бы от того,
  # что автор датасета сделает со своим репозиторием завтра.
  source_dir: "sources"
  source_url: "https://huggingface.co/api/datasets/Tobi-Bueck/customer-support-tickets/parquet/default/train/0.parquet"

  # --- Переработка источника ---
  # Чужой готовый набор — это сырьё, а не сдача (см. README, «Готовый датасет
  # как источник»). Параметры ниже — то, чем сдача отличается от «скачал
  # parquet и переименовал в raw.jsonl». Каждый из них отражён
  # в docs/datasheet.md.

  queues: null               # null — все очереди источника;
                             # список очередей — сузить набор до своей
                             # предметной области. Следите за
                             # diversity.min_groups: одна очередь не датасет.

  verify_labels: true        # сверять разметку источника: обязательные поля на
                             # месте, priority и type из допустимого набора,
                             # теги непустые. Дополнительно выбрасываются
                             # тикеты с одинаковым текстом и РАЗНОЙ разметкой:
                             # консистентность нельзя чинить выбором наугад.

  include_reply: true        # включать ответ оператора в JSON-ответ ассистента.
                             # false — задача сводится к чистой классификации,
                             # и тогда diversity.min_answer_len_ratio придётся
                             # снижать: длина JSON-метки зажата схемой.

  allowed_priorities: ["low", "medium", "high", "critical", "very_low"]
  allowed_types: ["Incident", "Request", "Problem", "Change"]

  system_prompts:            # В источнике инструкции нет вообще: это плоская
                             # таблица. Единственная формулировка на весь
                             # датасет модель заучивает как константу и
                             # ломается от перефраза, поэтому инструкция
                             # разведена на варианты; вариант выбирается
                             # детерминированно по id примера.
    - "You are a support desk triage assistant. Read the customer email and reply with a single JSON object containing the routing queue, the ticket type, the priority, the tags and a draft reply for the agent. Output JSON only."
    - "Triage an incoming support email. Return one JSON object with the fields queue, type, priority, tags and reply. The reply field holds the answer the agent should send. Do not write anything outside the JSON."
    - "Act as the first line of a helpdesk. Given the subject and body of a customer message, decide which queue it belongs to, what type and priority it has, which tags describe it, and draft the agent response. Answer with a single JSON object."
    - "Your task is ticket routing. From the customer email below, produce a JSON object holding the target queue, the ticket type, the priority level, the list of tags and a draft reply. No prose, no explanations, JSON only."
    - "Process this support request as a helpdesk system would: pick the queue, the type, the priority and the tags, then draft the reply the agent will send. Return everything as one JSON object and nothing else."

clean:
  # Фильтр длин: слишком короткий пример — обрезок, слишком длинный — выброс.
  min_user_chars: 30
  max_user_chars: 4000
  min_assistant_chars: 2
  near_dup:
    enabled: true
    shingle_words: 4         # длина словного шингла
    num_perm: 64             # перестановок MinHash: точность против скорости
    threshold: 0.85          # Жаккар выше порога — почти-дубль
  pii:
    enabled: true            # стадия обязательна, даже если счётчик нулевой

diversity:
  # Пороги, которым обязан удовлетворять ОЧИЩЕННЫЙ датасет. Стадия diversity
  # падает, если нарушен хоть один: набор из 30 однотипных строк проходит
  # и схему, и дедупликацию, и сплит — формально он безупречен и бесполезен.
  # Разбор такого случая: один системный промпт на все строки, ответы длиной
  # 356–440 символов, сквозные слова во всех ответах. Лосс на нём падает,
  # а модель выучивает шаблон вместо задачи.
  #
  # Пороги — не догма: их можно менять под свою задачу, но только в эту сторону
  # и только с обоснованием в docs/datasheet.md. «Снизил, чтобы позеленело» —
  # не обоснование. Здесь НИ ОДИН порог не менялся: значения ниже — авторские.

  min_examples: 1000         # строк после очистки. Меньше — модель увидит
                             # каждый пример по нескольку раз за эпоху.
  min_system_prompts: 3      # различных системных промптов
  min_groups: 50             # различных групп (split.group_key)
  max_group_share: 0.10      # доля крупнейшей группы: одна тема не должна
                             # решать за весь датасет
  min_answer_len_ratio: 1.6  # p90/p10 длин ответа ассистента. Ответы одной
                             # длины — верный признак сгенерированного шаблона.
                             # Если у вашей задачи ответы законно однотипные
                             # (метки классов, да/нет) — снижайте порог и
                             # покажите разнообразие на другой оси в datasheet.
  max_same_length_share: 0.25   # доля примеров с самой частой длиной ответа
  max_duplicate_answer_share: 0.30  # доля ответов-повторов (точные совпадения)

split:
  # Группа сплита. Тикеты одной темы не должны разъезжаться по train/test:
  # очередь и главный тег дословно определяют, о чём обращение, а формулировки
  # внутри одной темы — парафразы друг друга.
  group_key: "topic"
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  seed: 42

contamination:
  # Порог поиска near-dup пересечений train/test.
  # Обязан совпадать с clean.near_dup.threshold. Более строгий порог здесь
  # ловил бы не контаминацию, а разницу порогов: пары с Жаккаром между
  # порогом чистки и порогом проверки очистку проходят законно.
  threshold: 0.85

paths:
  raw: "data/raw.jsonl"
  clean: "data/clean.jsonl"
  train: "data/train.jsonl"
  val: "data/val.jsonl"
  test: "data/test.jsonl"
  metrics_collect: "metrics/collect.json"
  metrics_clean: "metrics/clean.json"
  metrics_split: "metrics/split.json"
  metrics_diversity: "metrics/diversity.json"
  datasheet: "docs/datasheet.md"
