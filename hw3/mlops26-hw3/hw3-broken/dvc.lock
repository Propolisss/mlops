    params:
      params.yaml:
        collect:
          version: v2
          n_rows: 40000
          sources:
            v1:
            - sources/tickets-en.jsonl
            v2:
            - sources/tickets-en.jsonl
            - sources/tickets-de.jsonl
          source_dir: sources
          source_url: 
            https://huggingface.co/api/datasets/Tobi-Bueck/customer-support-tickets/parquet/default/train/0.parquet
          queues:
          verify_labels: true
          include_reply: true
          allowed_priorities:
          - low
          - medium
          - high
          - critical
          - very_low
          allowed_types:
          - Incident
          - Request
          - Problem
          - Change
          system_prompts:
          - You are a support desk triage assistant. Read the customer email and
            reply with a single JSON object containing the routing queue, the 
            ticket type, the priority, the tags and a draft reply for the agent.
            Output JSON only.
          - Triage an incoming support email. Return one JSON object with the 
            fields queue, type, priority, tags and reply. The reply field holds 
            the answer the agent should send. Do not write anything outside the 
            JSON.
          - Act as the first line of a helpdesk. Given the subject and body of a
            customer message, decide which queue it belongs to, what type and 
            priority it has, which tags describe it, and draft the agent 
            response. Answer with a single JSON object.
          - Your task is ticket routing. From the customer email below, produce 
            a JSON object holding the target queue, the ticket type, the 
            priority level, the list of tags and a draft reply. No prose, no 
            explanations, JSON only.
          - 'Process this support request as a helpdesk system would: pick the queue,
            the type, the priority and the tags, then draft the reply the agent will
            send. Return everything as one JSON object and nothing else.'
        paths.raw: data/raw.jsonl
    outs:
    - path: data/raw.jsonl
      hash: md5
