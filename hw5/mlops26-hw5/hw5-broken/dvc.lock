      hash: md5
      md5: 87fbfd3d9b432ddbfe9c8c6110cad058
      size: 6778
    params:
      params.yaml:
        compare:
          max_new_tokens: 256
          prompts:
          - "Subject:\nConnectivity Problem\n\nMessage:\nHealthcare organization encountered
            sporadic network disruptions impacting PyTorch, Elasticsearch, and Smart
            Home Sensors due to Mesh Network instability. Network devices were rebooted,
            and Red Enterprise Linux systems were updated."
          - "Subject:\nRequest for Refund and Replacement\n\nMessage:\nI am contacting
            you to seek a refund and a replacement for the faulty devices and software
            licenses I received. The devices are not working as expected, and the
            software licenses are not compatible with my system. I would appreciate
            a refund for the damaged items and a quick replacement with suitable alternatives.
            Please find attached my purchase receipt for your records. Kindly inform
            me of the necessary steps to address this matter promptly."
          - "Subject:\nRecent Reports of Sporadic Access Difficulties\n\nMessage:\n\
            Have encountered sporadic access problems with the SaaS platform, potentially
            due to recent server updates causing overload. Initial diagnostics involved
            restarting servers and reverting recent modifications, yet the issues
            remain. Further investigation is required to identify and resolve the
            problem. Please continue monitoring the situation and keep us updated
            as necessary."
          - "Subject:\nError Detected in Payment Processing System\n\nMessage:\nWe
            are experiencing difficulties with the billing system, which is hindering
            our ability to process payments. This may be related to a recent software
            update. Despite restarting the systems and verifying account information,
            the problem persists. We would greatly appreciate your assistance in resolving
            this issue promptly to prevent service disruptions. Please help us address
            the billing system problem."
          - "Subject:\nDetails of Pricing Plans\n\nMessage:\nI am interested in learning
            about the project management SaaS offerings. Could you provide details
            on the available pricing plans and any trial options? I would also like
            to know about the features and benefits of each plan, as well as any discounts
            or promotions that may be available. This information will help me make
            an informed decision on whether the SaaS is the right fit for my needs."
          system: Triage an incoming support email. Return one JSON object with 
            the fields queue, type, priority, tags and reply. The reply field 
            holds the answer the agent should send. Do not write anything 
            outside the JSON.
          references:
          - IT Support / Incident / medium
          - Returns and Exchanges / Change / high
          - Service Outages and Maintenance / Problem / low
          - Billing and Payments / Problem / high
          - Product Support / Request / low
        model:
          name: Qwen/Qwen3-0.6B
          device: auto
          dtype: bfloat16
          enable_thinking: false
    outs:
    - path: docs/compare.md
      hash: md5
      md5: 3b7cea1d0539f9016be2384a90a93c53
      size: 5612
    - path: metrics/compare_all_layers.json
