groups:
  - name: inference
    rules:
      - alert: HighTTFC
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(inference_ttfc_seconds_bucket[30s]))) > 0.8
          and sum(increase(inference_ttfc_seconds_count[30s])) >= 10
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "p95 TTFC exceeds 0.8s with at least 10 completed requests / 30s"
      - alert: HighFailureRatio
        expr: |
          sum(rate(inference_requests_total{outcome!="completed"}[30s]))
          / sum(rate(inference_requests_total[30s])) > 0.05
          and sum(increase(inference_requests_total[30s])) >= 10
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "Failure ratio exceeds 5% with at least 10 outcomes / 30s"
