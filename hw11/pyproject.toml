[project]
name = "mlops-hw11"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "prometheus-client==0.21.1",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "matplotlib==3.10.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
