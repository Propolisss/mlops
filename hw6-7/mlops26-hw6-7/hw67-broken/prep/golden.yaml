# Разметка golden set, версия 1. Источник — data/split/test.jsonl ДЗ 3 (группы-темы
# test не пересекаются с train). Метка expected — queue из разметки датасета; тикет
# попадает сюда, только если текст письма сам указывает на эту очередь.
#
# Отброшено при отборе (причины, а не id):
# - метка противоречит тексту: «investment returns» в Returns and Exchanges,
#   жалоба на WhatsApp в Human Resources, маркетинговые стратегии в Product Support;
# - тикет одинаково подходит под две очереди: «биллинг + скидки для покупки» —
#   Billing или Sales, интеграции в Customer Service — Technical Support или IT;
# - перевод или пересказ уже взятого тикета той же темы: это один вопрос дважды.
